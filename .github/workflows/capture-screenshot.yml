name: Capture EGO UI Screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-screenshot.yml"
      - "scripts/capture_screenshot.py"
      - "src/alterego_training_hub/**"
      - "run_app.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/capture-screenshot.yml"
      - "scripts/capture_screenshot.py"
      - "src/alterego_training_hub/**"
      - "run_app.py"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ego-ui-screenshot-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python, Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-venv xvfb
      - name: Install EGO and screenshot dependencies
        run: |
          python3 -m venv --system-site-packages .venv-tk
          .venv-tk/bin/pip install -e ".[dev,package]"
      - name: Capture the actual application window
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" .venv-tk/bin/python scripts/capture_screenshot.py docs/screenshots/ego-main.png
      - name: Upload screenshot as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EGO-UI-Screenshot
          path: docs/screenshots/ego-main.png
          if-no-files-found: error
          retention-days: 30
      - name: Publish screenshot to the repository
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/ego-main.png
          if git diff --cached --quiet; then
            echo "The screenshot is unchanged."
            exit 0
          fi
          git commit -m "docs: refresh EGO interface screenshot"
          git push origin HEAD:main
