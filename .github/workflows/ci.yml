name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,package]"
      - name: Lint (ruff)
        run: ruff check src tests scripts --select F,E9
      - name: Compile
        run: python -m compileall -q src run_app.py tests
      - name: Tests (pytest)
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  desktop-bundle:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build standalone bundle (PyInstaller)
        run: |
          python -m pip install -e ".[package]" pyinstaller
          python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: AlterEgoTrainingHub-Linux-x64
          path: dist/AlterEgoTrainingHub
          if-no-files-found: error
          retention-days: 7
