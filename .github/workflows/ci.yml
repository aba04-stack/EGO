name: Desktop Training Hub CI

on:
  push:
    branches: [main, feature/desktop-app-mvp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python source
        run: python -m compileall -q src run_app.py tests
      - name: Run unit tests
        run: python -m pytest -q --tb=long
