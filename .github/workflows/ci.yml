name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,package]"
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Compile
        run: python -m compileall -q src run_app.py tests
      - name: Tests with coverage (ядро, порог из pyproject)
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report
      - name: Types (mypy, чистые модули)
        run: python -m mypy
      - name: Real end-to-end check (без моков)
        run: python scripts/real_check.py --quick

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  desktop-bundle:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build standalone bundle (PyInstaller)
        run: |
          python -m pip install -e ".[package]" pyinstaller
          python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: AlterEgoTrainingHub-Linux-x64
          path: dist/AlterEgoTrainingHub
          if-no-files-found: error
          retention-days: 7

  tk-smoke:
    # Настоящий Tk под виртуальным дисплеем: окно приложения целиком.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python + Tk + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-venv xvfb
      - name: Create venv with system Tk
        run: |
          python3 -m venv --system-site-packages .venv-tk
          .venv-tk/bin/pip install -e ".[package]"
      - name: Real Tk smoke under xvfb
        run: xvfb-run -a .venv-tk/bin/python scripts/tk_smoke.py

  real-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and real torch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.46.3" "peft==0.13.2" "datasets==3.1.0" "accelerate==1.1.1" "tokenizers==0.20.3"
      - name: Real training check (torch обязателен)
        run: python scripts/real_check.py --require-torch
