name: Windows Desktop Build

on:
  push:
    branches: [main, feature/desktop-app-mvp, arena/5b5c6f04-repo]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Keep Russian diagnostics readable in Windows subprocesses.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install app and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,package]"
      - name: Key-generation CLI preflight
        shell: pwsh
        run: |
          $keyDir = Join-Path $env:RUNNER_TEMP "ego-keygen-preflight"
          python scripts/sign_update.py make-keys --out-dir $keyDir
          if ($LASTEXITCODE -ne 0) { throw "Key-generation CLI preflight failed." }
          if (!(Test-Path (Join-Path $keyDir "private.pem")) -or
              !(Test-Path (Join-Path $keyDir "public.pem"))) {
            throw "Key-generation CLI did not create both key files."
          }
          Remove-Item -Recurse -Force $keyDir
      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q src run_app.py tests
          python -m pytest -vv -s --tb=long
      - name: Package Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name EGO --paths src --collect-submodules keyring.backends --add-data "src/alterego_training_hub/assets/fonts;alterego_training_hub/assets/fonts" run_app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed." }
          Compress-Archive -Path dist\EGO.exe -DestinationPath dist\EGO-Windows-x64.zip -Force
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EGO-Windows-x64
          path: dist/EGO-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  release:
    # Publish persistent release assets for a new project version on main,
    # or publish the exact version named by an explicit v* tag.
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.meta.outputs.tag }} already exists; skipping republish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python for release package
        if: steps.published.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and source archive
        if: steps.published.outputs.exists != 'true'
        shell: bash
        run: |
          python -m pip install build
          python -m build
      - name: Download Windows executable
        if: steps.published.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: EGO-Windows-x64
          path: release-assets
      - name: Publish GitHub release
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp dist/*.whl dist/*.tar.gz release-assets/
          cp release-download/install-windows.bat release-assets/
          cp release-download/install-linux-mac.sh release-assets/
          cp release-download/run-ego.bat release-assets/
          cp release-download/УСТАНОВКА.md release-assets/УСТАНОВКА.md
          gh release create "${{ steps.meta.outputs.tag }}" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "EGO ${{ steps.meta.outputs.tag }}" \
            --generate-notes
