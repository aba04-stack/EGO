[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alterego-training-hub-desktop"
version = "0.5.0"
description = "Desktop control panel for AlterEgo training repositories, API mentors, and cloud GPUs"
requires-python = ">=3.10"
dependencies = ["keyring>=25.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
package = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
